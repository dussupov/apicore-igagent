services:
  - type: web
    name: ig-agent-pro
    env: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DRY_RUN
        value: true
      - key: META_GRAPH_VERSION
        value: v23.0
      - key: DEFAULT_RATE_LIMIT_PER_MINUTE
        value: 15
      - key: PGSSLMODE
        value: require
      - key: DATABASE_URL
        fromDatabase:
          name: ig-agent-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: META_WEBHOOK_VERIFY_TOKEN
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  - name: ig-agent-db
